name: Publier le site (GitHub Pages)

on:
  push:
    branches: [claude/friendly-gates-r7wuki]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assembler le site
        run: |
          mkdir -p _site/app
          python3 tools/build_preview.py _site/index.html radial
          cp -r index.html app.js styles.css sw.js manifest.webmanifest assets _site/app/
          cat > _site/sw.js <<'JS'
          // Ancien service worker de la racine : on le retire (l'application installable est dans /app/)
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (e) => e.waitUntil(
            caches.keys().then((ks) => Promise.all(ks.map((k) => caches.delete(k)))).then(() => self.registration.unregister()),
          ));
          JS
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
